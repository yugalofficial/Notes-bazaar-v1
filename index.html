
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Safe Window.fetch shim: prevents 'Cannot set property fetch of #<Window> which has only a getter' without breaking native fetch execution -->
    <script>
        (function() {
            try {
                // Bind original fetch to window to avoid 'Illegal invocation'
                var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
                if (originalFetch) {
                    var currentFetch = originalFetch;
                    var fetchDescriptor = {
                        get: function() {
                            return currentFetch;
                        },
                        set: function(newFetch) {
                            if (typeof newFetch === 'function') {
                                currentFetch = newFetch.bind ? newFetch.bind(window) : newFetch;
                            } else {
                                currentFetch = newFetch;
                            }
                        },
                        configurable: true,
                        enumerable: true
                    };
                    
                    try {
                        Object.defineProperty(window, 'fetch', fetchDescriptor);
                    } catch (e1) {
                        try {
                            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' && Window.prototype);
                            if (proto) {
                                Object.defineProperty(proto, 'fetch', fetchDescriptor);
                            }
                        } catch (e2) {}
                    }
                }
            } catch (err) {
                console.warn("Fetch shim init warning:", err);
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NotesBazaar – Exam Prep &amp; Study Material</title>
    <meta name="description" content="A premium marketplace for digital handwritten notes optimized for SSC, Banking, UPSC, and Railways competitive exams. Features secure payments, instant downloads, and a robust admin dashboard.">
    <meta property="og:title" content="NotesBazaar – Exam Prep &amp; Study Material">
    <meta property="og:description" content="A premium marketplace for digital handwritten notes optimized for SSC, Banking, UPSC, and Railways competitive exams.">
    <!-- Synchronous Theme Pre-Hydration: prevents light-mode flash when Dark Mode is active -->
    <script>
        try {
            var savedTheme = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {}
    </script>
    <!-- Google Fonts: Premium Typography Suite -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Mobile App, iOS & Brand Favicon Meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NotesBazaar">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D9488">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    
    <!-- Razorpay SDK: loaded asynchronously so it never blocks page rendering on mobile connections -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer async></script>
    
    <!-- Non-blocking Runtime Safety Guard -->
    <script>
        (function() {
            window.addEventListener('unhandledrejection', function(event) {
                console.warn('Non-fatal background promise rejection:', event.reason);
            });
            window.onerror = function(message, source, lineno, colno, error) {
                console.error('Captured script error:', message, source, lineno, colno, error);
                return false;
            };
        })();
    </script>
</head>
